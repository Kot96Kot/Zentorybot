{% extends "base.html" %}
{% block content %}
<h1>Agents</h1>
<section class="card">
  <table>
    <thead><tr><th>Агент</th><th>Модуль</th><th>Статус</th><th>Mode</th></tr></thead>
    <tbody>
      {% for agent in agents %}
      <tr>
        <td>{{ agent.name }}</td>
        <td>{{ agent.module }}</td>
        <td><span class="pill {{ agent.status }}">{{ agent.status }}</span></td>
        <td>{{ agent.mode }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
