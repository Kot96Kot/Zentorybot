services:
  app:
    build: .
    command: uvicorn zentory.app.main:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://zentory:zentory@postgres:5432/zentory
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    working_dir: /app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zentory
      POSTGRES_PASSWORD: zentory
      POSTGRES_DB: zentory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
